settings:

    lib_name: nor_2_input_inverted

    units:
        time: ps
        voltage: V
        current: uA
        leakage_power: nW
        capacitive_load: pF
        energy: pJ

    named_nodes:

        primary_power:
            name: vdd
            voltage: 1.8

        primary_ground:
            name: vss
            voltage: 0

    debug: true

    results_dir: results

    simulation:

        input_capacitance_procedure: charge_integration

cells:

    nor_gate_1_in_inverted:

        netlist: nor_lib.spice

        models:
            - /foss/pdks/sky130A/libs.tech/ngspice/sky130.lib.spice tt

        area: 22.8208

        inputs:
            - A
            - B

        outputs:
            - OUT

        functions:
            - OUT=!( !A + B )

        data_slews:
            - 10
            - 100
            - 1000

        loads:
            - 0.0005
            - 0.01
            - 0.1
