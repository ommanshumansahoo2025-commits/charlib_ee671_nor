name: Generate Liberty (.lib) Files

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  characterize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (NGSPICE)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ngspice libngspice0-dev
          ngspice --version | head -n 3

      - name: Install Python Dependencies (CharLib & Ciel)
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/stineje/CharLib.git@2.0.0
          pip install ciel
          pip install "numpy<2" --force-reinstall

      - name: Download sky130 PDK via Ciel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export PDK_ROOT=/home/runner/pdk
          mkdir -p $PDK_ROOT
          ciel enable --pdk-family sky130 78b7bc32ddb4b6f14f76883c2e2dc5b5de9d1cbc

          echo "--- PDK_ROOT layout ---"
          ls -la $PDK_ROOT

          # ciel already creates $PDK_ROOT/sky130A; link to that
          ln -sfn "$(readlink -f $PDK_ROOT/sky130A)" ./sky130A

          test -f sky130A/libs.tech/ngspice/sky130.lib.spice

      - name: Show inputs
        run: |
          echo "--- cell netlist ---"
          cat cells/inverter.spice | cut -c1-200
          echo "--- charlib help ---"
          charlib run --help || true

      - name: Run CharLib Characterization
        run: |
          export PDK_ROOT=/home/runner/pdk
          mkdir -p output
          shopt -s nullglob
          # Characterize every config file in config/. Each YAML is a separate
          # run with its own lib_name, so schematic + PEX (+ any cell a student
          # adds) all build in one push -- no editing a shared config.
          status=0
          for cfg in config/*.yaml config/*.yml; do
            echo "===================================================="
            echo "=== Running CharLib on: $cfg"
            echo "====================================================" >> charlib.log
            echo "### $cfg" >> charlib.log
            charlib run "$cfg" >> charlib.log 2>&1 || {
              echo "!!! FAILED: $cfg (see charlib.log)"
              status=1
            }
          done
          if [ "$status" -ne 0 ]; then
            echo "=== last 80 lines of charlib.log ==="
            tail -n 80 charlib.log | cut -c1-300
            exit 1
          fi
          # Collect any .lib CharLib wrote, wherever it put it
          find . -maxdepth 3 -name '*.lib' -not -path './output/*' \
            -exec cp {} output/ \;
          echo "--- output dir ---"
          ls -R output

      - name: Upload CharLib log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: charlib-log
          path: charlib.log
          if-no-files-found: ignore

      - name: Upload .lib Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sky130-lib-files
          path: output/*.lib
          if-no-files-found: error
